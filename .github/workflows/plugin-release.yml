name: Plugin release

on:
  push:
    # Obsidian matches releases WITHOUT a 'v' prefix (tag `1.0.0`, not `v1.0.0`)
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run plugin:release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Obsidian installs main.js + manifest.json + styles.css by exact
          # filename; the data files + zip are for first-run download / manual install.
          files: |
            dist/quran-life-*.zip
            main.js
            manifest.json
            styles.css
            qpc-hafs-word-by-word.json
            sql-wasm.wasm
          generate_release_notes: true
