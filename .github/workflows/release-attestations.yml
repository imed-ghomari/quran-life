name: Release attestations

on:
  push:
    # Same version tags as the release workflow (no 'v' prefix: `1.0.5`).
    tags:
      - '[0-9]*'
      - 'v*'
  # Manual backfill for releases whose attest run failed: run with the release
  # tag checked out; the build is reproducible so attested digests match the
  # published assets byte-for-byte.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to attest (default: main)'
        required: false
        default: 'main'

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run plugin:release

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
